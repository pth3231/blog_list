# Dashboard provider — auto-loads any *.json in the bind-mounted
# /var/lib/grafana/dashboards directory (see compose.yaml grafana volumes).
apiVersion: 1
providers:
  - name: 'blog-list dashboards'
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
